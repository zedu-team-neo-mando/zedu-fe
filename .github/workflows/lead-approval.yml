name: Lead approval

# Caller: the logic lives in zedu-hng/zedu-ci (lead-approval.yml), pinned by commit. Keep the file name:
# other workflows look it up.
# The gate is switched off (`enforce_lead_approval: false`). One automatic run per head posts the
# "Lead approved" success that the reviewer queue waits for; the 5-minute sweep and label/review
# triggers are disabled. Dispatch it manually to re-check a PR.

on:
  pull_request_target:
    branches:
      - dev
      - central-staging
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to re-check
        required: true
      base_ref:
        description: Branch the pull request targets
        required: true

permissions: {}

concurrency:
  group: lead-approval-${{ github.event.pull_request.number || inputs.pr || github.run_id }}
  cancel-in-progress: true

jobs:
  approval:
    name: Lead approval
    if: vars.IS_BOOTCAMP == 'true'
    permissions:
      actions: write
      contents: read
      pull-requests: read
      statuses: write
    uses: zedu-hng/zedu-ci/.github/workflows/lead-approval.yml@8e31deaa857e62ed4bac364dfe8457eaaafd93f0
    with:
      enforce_lead_approval: false
