name: Lead approval review

# Trigger only. Runs on every review so review-feedback.yml (workflow_run) can set the
# changes-requested label without checking out PR code. Lead approval itself no longer re-checks
# automatically.

# The run name carries the PR number for review-feedback.
run-name: "Lead approval review #${{ github.event.pull_request.number }}"

on:
  pull_request_review:
    types:
      - submitted
      - edited
      - dismissed

permissions:
  contents: read

jobs:
  noted:
    name: Note review
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          PR: ${{ github.event.pull_request.number }}
        run: echo "Review on PR $PR; review-feedback.yml picks this up."
