title = "gitleaks config"

[extend]
# --config replaces the built-in ruleset unless this is set.
# Without it, this file had zero detection rules so hardcoded keys never failed.
useDefault = true

[[rules]]
id = "hardcoded-source-secret"
description = "High-entropy string assigned in source, regardless of variable name"
regex = '''(?i)(?:const|let|var)\s+[A-Za-z_][\w]*\s*=\s*['"]([A-Za-z0-9+=_.-]{20,})['"]'''
entropy = 3.5
keywords = [
  "const",
  "let",
  "var",
]

  # Browser storage keys and cache names are public identifiers, not credentials.
  [[rules.allowlists]]
  description = "Zedu-prefixed storage keys and cache names"
  regexTarget = "secret"
  regexes = [
    '''^zedu[_-][a-z0-9_-]+$''',
  ]

[allowlist]
description = "Allow known test fixtures and generated files"
paths = [
  '''integration\.json''',
  '''(?:^|/)\.github/''',
]
